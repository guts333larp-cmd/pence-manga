
name: Build Mobile APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Flet
        run: |
          pip install flet
          pip install "flet[cli]"

      - name: Setup Flutter
        run: flet version

      - name: Build APK
        run: flet build apk --main main.py

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pence-manga-apk
          path: build/apk/app-release.apk

